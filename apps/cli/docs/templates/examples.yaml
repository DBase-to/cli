dbase-init:
  - id: basic-usage
    name: Basic usage
    code: dbase init
    response: Finished dbase init.
  - id: from-workdir
    name: Initialize from an existing directory
    code: dbase init --workdir .
    response: Finished dbase init.
  - id: with-orioledb
    name: Initialize with OrioleDB
    code: dbase init --use-orioledb
    response: Finished dbase init.
dbase-login:
  - id: basic-usage
    name: Basic usage
    code: dbase login
    response: |
      You can generate an access token from https://dbase.to/dashboard/account/tokens
      Enter your access token: sbp_****************************************
      Finished dbase login.
dbase-link:
  - id: basic-usage
    name: Basic usage
    code: dbase link ********************
    response: |
      Enter your database password (or leave blank to skip): ********
      Finished dbase link.
  - id: without-password
    name: Link without database password
    code: dbase link ******************** <<< ""
    response: |
      Enter your database password (or leave blank to skip):
      Finished dbase link.
  - id: using-alternate-dns
    name: Link using DNS-over-HTTPS resolver
    code: dbase link ******************** --dns-resolver https
    response: |
      Enter your database password (or leave blank to skip):
      Finished dbase link.
dbase-start:
  - id: basic-usage
    name: Basic usage
    code: dbase start
    response: |
      Creating custom roles supabase/roles.sql...
      Applying migration 20220810154536_employee.sql...
      Seeding data supabase/seed.sql...
      Started dbase local development setup.
  - id: without-studio
    name: Start containers without studio and imgproxy
    code: dbase start -x studio,imgproxy
    response: |
      Excluding container: supabase/studio:20221214-4eecc99
      Excluding container: darthsim/imgproxy:v3.8.0
      Started dbase local development setup.
  - id: ignore-health-check
    name: Ignore service health checks
    code: dbase start --ignore-health-check
    response: |
      service not healthy: [supabase_storage_cli]
      Started dbase local development setup.
dbase-stop:
  - id: basic-usage
    name: Basic usage
    code: dbase stop
    response: |
      Stopped dbase local development setup.
      Local data are backed up to docker volume.
  - id: clean-up
    name: Clean up local data after stopping
    code: dbase stop --no-backup
    response: |
      Stopped dbase local development setup.
