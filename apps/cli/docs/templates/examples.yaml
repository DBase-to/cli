dbase-migration-list:
  - id: basic-usage
    name: Basic usage
    code: dbase migration list --remote
    response: |2
            LOCAL      │     REMOTE     │     TIME (UTC)
      ─────────────────┼────────────────┼──────────────────────
                       │ 20230103054303 │ 2023-01-03 05:43:03
                       │ 20230103093141 │ 2023-01-03 09:31:41
        20230222032233 │                │ 2023-02-22 03:22:33
  - id: with-db-url
    name: Connect to self-hosted database
    code: dbase migration list --remote='postgres://postgres[:percent_encoded_password]@db.example.com[:port]/postgres'
    response: |2
            LOCAL      │     REMOTE     │     TIME (UTC)
      ─────────────────┼────────────────┼──────────────────────
        20230103054303 │ 20230103054303 │ 2023-01-03 05:43:03
        20230103093141 │ 20230103093141 │ 2023-01-03 09:31:41
dbase-migration-new:
  - id: basic-usage
    name: Basic usage
    code: dbase migration new schema_test
    response: |
      Created new migration at supabase/migrations/20230306095710_schema_test.sql.
  - id: pipe-stdin
    name: With statements piped from stdin
    code: echo "create schema if not exists test;" | dbase  new schema_test
    response: |
      Created new migration at supabase/migrations/20230306095710_schema_test.sql.
dbase-migration-repair:
  - id: basic-usage
    name: Mark a migration as reverted
    code: dbase migration repair 20230103054303 --status reverted --yes --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Confirmed by --yes: Mark 1 migration as reverted on project My Project (abcdefghijklmnopqrst) · production
      Repaired migration history: [20230103054303] => reverted
  - id: mark-applied
    name: Mark a migration as applied
    code: dbase migration repair 20230222032233 --status applied --yes --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Confirmed by --yes: Mark 1 migration as applied on project My Project (abcdefghijklmnopqrst) · production
      Repaired migration history: [20230222032233] => applied
dbase-db-diff:
  - id: basic-usage
    name: Basic usage
    code: dbase db diff -f my_table
    response: |
      Target: local stack (127.0.0.1:54322)
      Creating shadow database...
      Applying migration 20230425064254_remote_commit.sql...
      Diffing schemas: auth,extensions,public,storage
      Finished dbase db diff on branch main.

      No schema changes found
  - id: linked-project
    name: Against linked project
    code: dbase db diff -f my_table --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Creating shadow database...
      Diffing schemas: auth,extensions,public,storage
      Finished dbase db diff on branch main.

      WARNING: The diff tool is not foolproof, so you may need to manually rearrange and modify the generated migration.
      Run dbase db reset to verify that the new migration does not generate errors.
  - id: specific-schema
    name: For a specific schema
    code: dbase db diff -f my_table --schema auth
    response: |
      Target: local stack (127.0.0.1:54322)
      Creating shadow database...
      Diffing schemas: auth
      Finished dbase db diff on branch main.

      No schema changes found
dbase-db-dump:
  - id: basic-usage
    name: Basic usage
    code: dbase db dump -f supabase/schema.sql
    response: |
      Target: local stack (127.0.0.1:54322)
      Dumping schemas from local database...
      Dumped schema to supabase/schema.sql.
  - id: linked-project
    name: Dump the linked project
    code: dbase db dump -f supabase/schema.sql --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Dumping schemas from remote database...
      Dumped schema to supabase/schema.sql.
  - id: role-only
    name: Role only
    code: dbase db dump -f supabase/roles.sql --role-only --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Dumping roles from remote database...
      Dumped schema to supabase/roles.sql.
  - id: data-only
    name: Data only
    code: dbase db dump -f supabase/seed.sql --data-only --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Dumping data from remote database...
      Dumped schema to supabase/seed.sql.
dbase-db-lint:
  - id: basic-usage
    name: Basic usage
    code: dbase db lint
    response: |
      Linting schema: public

      No schema errors found
  - id: schema-warnings
    name: Warnings for a specific schema
    code: dbase db lint --level warning --schema storage
    response: |
      Linting schema: storage
      [
        {
          "function": "storage.search",
          "issues": [
            {
              "level": "warning",
              "message": "unused variable \"_bucketid\"",
              "sqlState": "00000"
            }
          ]
        }
      ]
dbase-db-pull:
  - id: basic-usage
    name: Basic usage
    code: dbase db pull --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      ◇  Update the remote migration history table on project My Project (abcdefghijklmnopqrst) · production?
      │  Yes
      Schema written to supabase/migrations/20240414044403_remote_schema.sql
      Repaired migration history: [20240414044403] => applied
      Finished dbase db pull.
  - id: local-studio
    name: Local studio
    code: dbase db pull
    response: |
      Target: local stack (127.0.0.1:54322)
      Creating shadow database...
      Seeding globals from roles.sql...
      Applying migration 20240414044403_remote_schema.sql...
      Diffing schemas...
      No schema changes found
      The remote database is already in sync with your local migrations — nothing to pull.
  - id: custom-schemas
    name: Custom schemas
    code: dbase db pull --schema public,extensions --remote
    response: |
      Target: project My Project (abcdefghijklmnopqrst) · production
      Creating shadow database...
      Seeding globals from roles.sql...
      Applying migration 20240414044403_remote_schema.sql...
      Diffing schemas: public,extensions
      No schema changes found
      The remote database is already in sync with your local migrations — nothing to pull.
dbase-db-push:
  - id: basic-usage
    name: Basic usage
    code: dbase db push --remote
    response: |
      Linked project is up to date.
  - id: self-hosted
    name: Self hosted
    code: dbase db push --remote="postgres://user:pass@db.example.com:5432/postgres"
    response: |
      Pushing migration 20230410135622_create_employees_table.sql...
      Finished dbase db push.
  - id: dry-run
    name: Dry run
    code: dbase db push --dry-run --remote
    response: |
      DRY RUN: migrations will *not* be pushed to the database.
      Would push migration 20230410135622_create_employees_table.sql...
      Would push migration 20230425064254_my_table.sql...
      Finished dbase db push.
dbase-db-reset:
  - id: basic-usage
    name: Basic usage
    code: dbase db reset
    response: |
      Resetting database...
      Initializing schema...
      Applying migration 20220810154537_create_employees_table.sql...
      Seeding data supabase/seed.sql...
      Finished dbase db reset on branch main.
dbase-db-schema-declarative-sync:
  - id: with-pg-delta
    name: Sync declarative schema with pg-delta
    code: |
      # After editing declarative schema files, generate a migration:
      dbase db schema declarative sync --experimental
    response: |
      Creating shadow database...
      Applying declarative schemas via pg-delta...
      Applied 239 statements in 1 round(s).
      Enter a name for this migration (press Enter to keep 'declarative_sync'): add_updated_at
      Created new migration at supabase/migrations/20260317194051_add_updated_at.sql
      Apply this migration to local database? [Y/n]
      Target: local stack (127.0.0.1:54322)
      Applying migration 20260317194051_add_updated_at.sql...
      Migration applied successfully.
  - id: generate-first
    name: Generate declarative schema from migrations
    code: |
      dbase db schema declarative sync --experimental
    response: |
      No declarative schema found. Generate a new one ? [Y/n]
      Reset local database to match migrations first? (local data will be lost) [y/N] y
      Resetting database...
      ...
      Declarative schema written to supabase/schemas
      Finished dbase db schema declarative generate.
dbase-test-db:
  - id: basic-usage
    name: Basic usage
    code: dbase test db
    response: |
      /tmp/supabase/tests/nested/order_test.pg .. ok
      /tmp/supabase/tests/pet_test.sql .......... ok
      All tests successful.
      Files=2, Tests=2,  6 wallclock secs ( 0.03 usr  0.01 sys +  0.05 cusr  0.02 csys =  0.11 CPU)
      Result: PASS
# TODO: use actual cli response for sso commands
dbase-sso-show:
  - id: basic-usage
    name: Show information
    code: |-
      dbase sso show 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the identity provider in pretty output.
  - id: metadata-output
    name: Get raw SAML 2.0 Metadata XML
    code: |-
      dbase sso show 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --metadata \
        --remote=abcdefghijklmnopqrst
    response: |-
      Raw SAML 2.0 XML assigned to this identity provider. This is the
      version used in the authentication project, and if using a SAML 2.0
      Metadata URL it may change depending on the caching information
      contained within the metadata.
dbase-sso-update:
  - id: basic-usage
    name: Replace domains
    code: |-
      dbase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --domains new-company.com,new-company.net \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the updated provider.
  - id: add-domains
    name: Add an additional domain
    code: |-
      dbase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --add-domains company.net \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the updated provider.
  - id: remove-domains
    name: Remove a domain
    code: |-
      dbase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --remove-domains company.org \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the updated provider.
dbase-sso-remove:
  - id: basic-usage
    name: Remove a provider
    code: |-
      dbase sso remove 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the removed identity provider. It's a good idea to
      save this in case you need it later on.
dbase-sso-add:
  - id: basic-usage
    name: Add with Metadata URL
    code: |-
      dbase sso add \
        --type saml \
        --metadata-url 'https://...' \
        --domains company.com \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the added identity provider. You can use
      company.com as the domain name on the frontend side to initiate a SSO
      request to the identity provider.
  - id: with-xml
    name: Add with Metadata File
    code: |-
      dbase sso add \
        --type saml \
        --metadata-file /path/to/metadata/file.xml \
        --domains company.com \
        --remote=abcdefghijklmnopqrst
    response: |-
      Information about the added identity provider. You can use
      company.com as the domain name on the frontend side to initiate a SSO
      request to the identity provider.
dbase-sso-info:
  - id: basic-usage
    name: Show project information
    code: dbase sso info --remote=abcdefghijklmnopqrst
    response: Information about your project's SAML 2.0 configuration.
