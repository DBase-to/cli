name: Release Shared

on:
  workflow_call:
    inputs:
      version:
        description: npm package version to publish
        required: true
        type: string
      npm_tag:
        description: npm dist-tag to publish under (latest | beta | next | v<N>.stable)
        required: true
        type: string
      channel:
        description: semantic-release channel name (beta | stable | next | maintenance)
        required: true
        type: string
      prerelease:
        description: Whether the GitHub release should be marked as a prerelease
        required: true
        type: boolean
      dry_run:
        description: Dry run (skip actual publishing)
        required: true
        type: boolean
      publish_brew_scoop:
        description: Whether to update the Homebrew tap and Scoop bucket
        required: false
        type: boolean
        default: false
      brew_name:
        description: Homebrew formula name (e.g. dbase, dbase-beta or dbase@<N>)
        required: false
        type: string
        default: dbase
      scoop_name:
        description: Scoop manifest name (e.g. dbase, dbase-beta or dbase-v<N>-stable)
        required: false
        type: string
        default: dbase
    secrets:
      SENTRY_DSN:
        required: false
      POSTHOG_API_KEY:
        required: false
      POSTHOG_ENDPOINT:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      DF_FIREWALL_TOKEN:
        required: false
jobs:
  build:
    name: Build CLI artifacts
    uses: ./.github/workflows/build-cli-artifacts.yml
    with:
      version: ${{ inputs.version }}
      runner: ubuntu-latest
      timeout_minutes: 45
      build_timeout_minutes: 20
    secrets:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_ENDPOINT: ${{ secrets.POSTHOG_ENDPOINT }}
      DF_FIREWALL_TOKEN: ${{ secrets.DF_FIREWALL_TOKEN }}

  smoke-test:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NPM_TAG: ${{ inputs.npm_tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Restore build artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/cli-*/bin/
            dist/
          key: cli-build-${{ github.run_id }}-${{ inputs.version }}-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Docker's classic image store keeps a single platform manifest per tag, so pulling
      # `alpine:3.21` for amd64 then arm64 leaves only the most recent in the local store, and
      # `docker save` captures only that one. The containerd snapshotter lets the store hold
      # multi-platform manifests under a single tag instead.
      - name: Enable containerd image store
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}'

      # The host's binfmt_misc must be mounted before installing QEMU. On cold runners it
      # isn't mounted by default, so setup-qemu-action's privileged installer registers the qemu
      # interpreters inside its own mount namespace — they vanish when the container exits, and
      # `docker run --platform linux/arm64` fails with "exec format error" (only on cold-VM runs,
      # since warm VMs already have it mounted). Mount it on the host after the docker restart so
      # the registration lands in the host kernel.
      - name: Ensure binfmt_misc is mounted on the host
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          mountpoint /proc/sys/fs/binfmt_misc

      - name: Setup QEMU for cross-platform Docker
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Verify linux/arm64 emulation is registered
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Fail fast with a clear message instead of opaque "exec format error"
          # lines in the smoke tests if the qemu-aarch64 handler did not land in
          # the host kernel. Reads binfmt_misc directly — no image pull, no network.
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Caches the smoke-test base images across runs — without it, eight parallel `docker run`
      # calls in smoke-test-linux.ts race on first-time pulls and fail with docker exit 125
      # ("daemon could not start the container"). Bump the `-v<N>` suffix to invalidate when the
      # image list or tags change.
      - name: Cache smoke-test docker images
        if: runner.os == 'Linux'
        id: smoke-docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/smoke-docker-images.tar
          key: smoke-docker-images-debian-bookworm-slim-amazonlinux-2023-alpine-3.21-v1

      - name: Load cached smoke-test docker images
        if: runner.os == 'Linux' && steps.smoke-docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/smoke-docker-images.tar

      - name: Pull and save smoke-test docker images
        if: runner.os == 'Linux' && steps.smoke-docker-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          images=("debian:bookworm-slim" "amazonlinux:2023" "alpine:3.21")
          for image in "${images[@]}"; do
            for platform in linux/amd64 linux/arm64; do
              echo "::group::Pulling $platform $image"
              attempt=0
              until docker pull --platform "$platform" "$image"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 3 ]; then
                  echo "Failed to pull $platform $image after $attempt attempts" >&2
                  exit 1
                fi
                sleep $((attempt * 5))
              done
              echo "::endgroup::"
            done
          done
          docker save "${images[@]}" -o "$HOME/.cache/smoke-docker-images.tar"

      - name: Install Scoop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $env:GITHUB_PATH

      - name: Fix binary permissions
        if: runner.os != 'Windows'
        run: chmod +x packages/cli-*/bin/dbase || true

      - name: Run smoke tests
        # Force bash so ${VERSION}/${NPM_TAG} expand identically across the ubuntu/macos/windows
        # matrix — windows-latest defaults to pwsh, which treats those as empty PowerShell variables.
        shell: bash
        run: pnpm run test:smoke -- --version "${VERSION}" --tag "${NPM_TAG}"
        working-directory: apps/cli

  smoke-test-macos:
    needs:
      - build
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      NPM_TAG: ${{ inputs.npm_tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      - name: Restore build artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/cli-*/bin/
            dist/
          key: cli-build-${{ github.run_id }}-${{ inputs.version }}-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Fix binary permissions
        run: chmod +x packages/cli-*/bin/dbase || true

      - name: Run smoke tests
        shell: bash
        run: pnpm run test:smoke -- --version "${VERSION}" --tag "${NPM_TAG}"
        working-directory: apps/cli

  publish:
    needs:
      - build
      - smoke-test
      - smoke-test-macos
    if: ${{ !cancelled() && !inputs.dry_run && needs.build.result == 'success' && needs.smoke-test.result == 'success' && needs.smoke-test-macos.result == 'success' }}
    # npm provenance verification needs a github-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHANNEL: ${{ inputs.channel }}
      NPM_TAG: ${{ inputs.npm_tag }}
      VERSION: ${{ inputs.version }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Generate release repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      # The cache key includes this run's id, so only this run's build job can have written it.
      # jactionlint ignore=cache-poisoning
      - name: Restore build artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/cli-*/bin/
            dist/
          key: cli-build-${{ github.run_id }}-${{ inputs.version }}-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Sync versions
        run: bun apps/cli/scripts/sync-versions.ts --version "${VERSION}"

      # Trusted publishing covers later releases; a new npm package needs a
      # granular token for its first publish. Set the NPM_TOKEN secret for that
      # first run, then delete it and rely on the trusted publisher.
      - name: Configure npm auth for the first publish
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: bun apps/cli/scripts/publish.ts --tag "${NPM_TAG}"

      - name: Configure git for release pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Pushes the tag as soon as npm has the bytes, before any downstream step that can fail —
      # otherwise a later failure leaves origin untagged for a version already live on npm, and
      # `semantic-release --dry-run` on the next push keeps recomputing the same version.
      # Idempotent: skips if the tag is already on origin.
      - name: Push version tag
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already on origin; skipping push."
          else
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "${tag}"
          fi

      # semantic-release matches tags against branch.channel using git-notes under
      # refs/notes/semantic-release-<tag>; without this note, the develop plan job recomputes
      # the same prerelease version every push (see docs/ci-beta-tags-investigation.md). Stable
      # releases on main don't need this, since main's branch config has no explicit channel.
      #
      # The note must attach to the underlying commit, not the annotated tag object created by
      # "Push version tag" above — semantic-release reads notes via `git log --no-walk
      # --tags=* --notes=...`, which looks at commits, so a note on the tag object leaves the tag
      # with channels:[null] and the plan falls back to the last stable. Hence the
      # `${tag}^{commit}` deref.
      - name: Push channel note for prerelease tags
        if: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          note_ref="refs/notes/semantic-release-${tag}"
          if git ls-remote origin "${note_ref}" | grep -q .; then
            echo "Channel note ${note_ref} already on origin; skipping push."
          else
            git notes --ref="${note_ref}" add -f -m "{\"channels\":[\"${CHANNEL}\"]}" "${tag}^{commit}"
            git push origin "${note_ref}"
          fi

      # Install scripts and other tools reference
      # releases/latest/download/<unversioned>.tar.gz, so republish that alias alongside the
      # versioned tarball.
      - name: Create unversioned tarball aliases
        run: |
          set -euo pipefail
          for triple in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64 windows_arm64 windows_amd64; do
            cp "dist/dbase_${VERSION}_${triple}.tar.gz" "dist/dbase_${triple}.tar.gz"
          done

      # Created empty; the next step uploads the assets so each one can be retried on its own.
      # Re-runs skip this step when the release already exists.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping."
          else
            args=(--draft --verify-tag --title "${tag}")
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "${tag}" "${args[@]}"
          fi

      # One asset at a time with per-asset retries; see apps/cli/scripts/upload-release-assets.ts.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun apps/cli/scripts/upload-release-assets.ts upload --version "${VERSION}"

      # Publishing makes the release immutable, so require every expected asset to be uploaded first.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun apps/cli/scripts/upload-release-assets.ts verify --version "${VERSION}"

      # Lets installers such as aqua and mise verify each asset with `gh attestation verify`; the
      # unversioned tarball aliases share their versioned twin's digest, so they are covered too.
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/dbase_${{ inputs.version }}_*
            dist/checksums.txt
            install

      - name: Publish GitHub Release (immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--draft=false)
          if [[ "$CHANNEL" == maintenance ]]; then
            args+=(--latest=false)
          fi
          gh release edit "v${VERSION}" "${args[@]}"

  publish-homebrew:
    needs: publish
    if: ${{ !cancelled() && !inputs.dry_run && inputs.publish_brew_scoop && needs.publish.result == 'success' }}
    # github-hosted to share a cache store with build/publish, whose
    # -v1 artifacts this job's checksums must match.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BREW_NAME: ${{ inputs.brew_name }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      # Restores this workflow's build, the same artifacts the publish job uploads
      # to the GitHub Release, so the formula's checksums match the released tarballs.
      - name: Restore build artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/cli-*/bin/
            dist/
          key: cli-build-${{ github.run_id }}-${{ inputs.version }}-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap
          permission-contents: write

      - name: Configure git for tap push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Homebrew formula
        run: bun apps/cli/scripts/update-homebrew.ts --version "${VERSION}" --name "${BREW_NAME}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-scoop:
    needs: publish
    if: ${{ !cancelled() && !inputs.dry_run && inputs.publish_brew_scoop && needs.publish.result == 'success' }}
    # github-hosted to share a cache store with build/publish, whose
    # -v1 artifacts this job's checksums must match.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCOOP_NAME: ${{ inputs.scoop_name }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          dependency-firewall-token: ${{ secrets.DF_FIREWALL_TOKEN }}

      # Restores this workflow's build, the same artifacts the publish job uploads
      # to the GitHub Release, so the manifest's hashes match the released tarballs.
      - name: Restore build artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/cli-*/bin/
            dist/
          key: cli-build-${{ github.run_id }}-${{ inputs.version }}-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate Scoop bucket token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            scoop-bucket
          permission-contents: write

      - name: Configure git for bucket push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Scoop manifest
        run: bun apps/cli/scripts/update-scoop.ts --version "${VERSION}" --name "${SCOOP_NAME}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Post-publish check that the Homebrew tap, Scoop bucket, and curl|bash install script
  # actually install the just-released CLI — brew/scoop verify the published checksum against
  # the downloaded tarball, catching a mismatch like CLI v2.107.0. Only runs when brew/scoop were
  # published and both pushes succeeded. A skipped channel has no post-publish install check;
  # the install-script leg here covers the GitHub Release assets. Runs last and doesn't gate the
  # rest of the channel.
  verify-install-channels:
    needs: [publish, publish-homebrew, publish-scoop]
    if: ${{ always() && !inputs.dry_run && inputs.publish_brew_scoop && needs.publish-homebrew.result == 'success' && needs.publish-scoop.result == 'success' }}
    uses: ./.github/workflows/verify-install-channels.yml
    with:
      version: ${{ inputs.version }}
      brew_name: ${{ inputs.brew_name }}
      scoop_name: ${{ inputs.scoop_name }}
